# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "SimpsonsWrestling"
id = "SLUS-01227"
players = 2
exe = "disc/SLUS_012.27"
disc = "disc/Simpsons Wrestling, The (USA).cue"   # the launcher passes the player's own disc with --disc
load_address = "0x80010000"
entry_pc = "0x80058B74"
text_size = "0x000CE000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Simpsons Wrestling, The (USA).bin"
cue_name = "Simpsons Wrestling, The (USA).cue"
boot_exe = "SLUS_012.27"
known_sizes = [506830128]
known_md5 = [
  "b489a333223817199d5ba9ac09e697e0",
]
known_sha1 = [
  "38602a1b9482670dbbd8ab25aa4a8bb520b5bebe",
]
known_crc32 = [
  "da509886",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Trusted mod entry hooks (simpsons_mods.c, package simpsons.pc). Inert unless
# the plugin registers for them. Changing this list needs a regenerate.
mod_function_entry_funcs = [
  "0x80044628",  # PlayMovie(index, flag): Skip Intro returns at once for the logos
  "0x80044F74",  # frame step getter: Skip Intro ends the copyright card's 5 s loop
  "0x8005E0CC",  # DrawOTag: widescreen HUD packets are tagged with their screen edge
  "0x800471E0",  # wait-for-flip spin: fast-forwarded to the VBlank that clears it
]

[runtime]
window_title = "The Simpsons Wrestling"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

# Widescreen (the simpsons.pc plugin selects 16:9; these are identity at 4:3).
# The arena is drawn cell by cell (0x80054714): each 256-unit cell's centre is
# projected and the whole cell skipped unless -100 <= SX < 612, a 100 px margin
# around the 512-wide screen. In 16:9 the view shows 85 px more per side, so
# cells (crowd blocks, floor, props) vanished while still on screen. Both
# immediates take the live margin: keep -100-m <= SX < 612+m.
[widescreen.cull]
bias_sites  = ["0x8005496C"]   # addiu v0,v0,0x64   SX + 100
range_sites = ["0x80054974"]   # sltiu v0,v0,0x2C8  < 512 + 2*100
# 64 px beyond the original margin (cells drawn until their centre is 164 px
# past the wide edge); costs no measurable primitives. Still 0 at 4:3.
guard_pixels = 64

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "06952d1bcedea390642a158b77acef18b37414ece5ca8a7e334c1d53ebc71521"
